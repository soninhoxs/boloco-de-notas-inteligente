apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: diario
data:
  PORT: "8080"
  ENVIRONMENT: "production"
  DB_MAX_OPEN_CONNS: "25"
  DB_MAX_IDLE_CONNS: "10"
  DB_CONN_MAX_LIFETIME: "5m"
  REDIS_DB: "0"
  MINIO_BUCKET: "attachments"
  MINIO_USE_SSL: "true"
  JWT_ACCESS_EXPIRES: "15m"
  JWT_REFRESH_EXPIRES: "168h"
  AI_DEFAULT_PROVIDER: "groq"
  AI_MAX_RETRIES: "3"
  AI_TIMEOUT: "30s"
  WORKER_COUNT: "2"
